<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d"><title>LUMEN / GRID</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#07111d;color:#e1f5ff;font-family:system-ui,sans-serif;overflow:hidden}#unity-canvas{display:block;width:100%;height:100%;outline:none;background:#07111d;touch-action:none}#loader{position:fixed;inset:0;display:grid;place-content:center;padding:32px;background:radial-gradient(ellipse at 70% 55%,#102e40,#07111d 65%)}.logo{width:min(650px,78vw);height:auto;margin-bottom:40px}.eyebrow{font-size:11px;letter-spacing:.22em;color:#58e5ff;margin:0 0 28px}.track{height:2px;width:100%;background:#243947;margin:28px 0 18px}#progress{height:100%;width:0;background:#58e5ff;transition:width .2s}#status{font-size:14px;line-height:1.9;max-width:650px;white-space:pre-line;overflow-wrap:anywhere;margin:0}.hint{font-size:12px;line-height:1.8;color:#8ba6b8;margin:18px 0 0}#reload{margin-top:24px;justify-self:start;border:1px solid #58e5ff;background:transparent;color:#e1f5ff;padding:12px 24px;cursor:pointer}#reload[hidden],#loader[hidden]{display:none}.error{color:#ffba68}noscript{position:fixed;inset:30%;line-height:2}
</style>
</head>
<body>
<canvas id="unity-canvas" width="1280" height="820" tabindex="0" aria-label="LUMEN GRID ゲーム画面"></canvas>
<section id="loader" aria-live="polite"><p class="eyebrow">URBAN NETWORK SYSTEM / INITIALIZING</p><img class="logo" src="TemplateData/logo.png" alt="LUMEN / GRID"><p id="status" role="status">都市のネットワークを読み込んでいます。</p><div class="track" role="progressbar" aria-label="読み込み" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div><p class="hint">PCのキーボード・マウスで操作します。<br>セーブはこのブラウザ内に保存されます。</p><button id="reload" hidden>再読み込み</button></section>
<noscript>このゲームにはJavaScriptが必要です。ブラウザの設定を確認してください。</noscript>
<script>
const canvas=document.getElementById('unity-canvas'),loader=document.getElementById('loader'),status=document.getElementById('status');
function failed(message){loader.hidden=false;status.className='error';status.textContent='ゲームを起動できませんでした。\n'+String(message)+'\nWebGL 2対応ブラウザと、ネットワーク接続をご確認ください。';document.getElementById('reload').hidden=false;}
document.getElementById('reload').onclick=()=>location.reload();
canvas.addEventListener('pointerdown',()=>canvas.focus());
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s')e.preventDefault();if(['Tab',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>failed('読み込み用ファイルを取得できません。');
script.onload=()=>{createUnityInstance(canvas,{
arguments:[],dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',
companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error')failed(message);else console.warn(message);}
},value=>{let percent=Math.round(value*100);document.getElementById('progress').style.width=percent+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',percent);status.textContent='都市のネットワークを読み込んでいます。 '+percent+'%';}).then(()=>{loader.hidden=true;canvas.focus();}).catch(failed);};document.body.appendChild(script);
</script>
</body></html>
